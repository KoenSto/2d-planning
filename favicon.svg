:root {
  color-scheme: light;
  --ink: #162626;
  --ink-soft: #516060;
  --surface: #ffffff;
  --surface-soft: #f3f5f2;
  --surface-muted: #edf1ee;
  --line: #d7dfdc;
  --line-strong: #b8c6c1;
  --brand: #0f3d3e;
  --brand-hover: #0a3031;
  --brand-soft: #d9f2e6;
  --accent: #f6b73c;
  --danger: #b42318;
  --danger-soft: #fff0ee;
  --building: #dd4b39;
  --green: #238636;
  --parking: #6b7280;
  --public: #2563eb;
  --shadow: 0 12px 32px rgba(27, 56, 49, 0.12);
  --shadow-small: 0 4px 16px rgba(27, 56, 49, 0.1);
  --radius: 14px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--surface-soft);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, #map:focus-visible {
  outline: 3px solid rgba(246, 183, 60, 0.55);
  outline-offset: 2px;
}
.hidden { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-shell { height: 100vh; display: flex; flex-direction: column; }
.topbar {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 1200;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
.brand img { flex: 0 0 auto; }
.brand strong { display: block; font-size: 17px; letter-spacing: -0.02em; }
.brand span { display: block; color: var(--ink-soft); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
.save-status { color: var(--ink-soft); font-size: 12px; margin-right: 4px; }

.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 312px minmax(420px, 1fr) 324px;
}
.panel {
  min-width: 0;
  overflow-y: auto;
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.panel-left { border-right: 1px solid var(--line); }
.panel-right { border-left: 1px solid var(--line); }
.panel-section { padding: 17px 18px; border-bottom: 1px solid var(--line); }
.panel-section:last-child { border-bottom: 0; }
.panel-section-muted { background: var(--surface-soft); }
.panel-section-actions { display: grid; gap: 8px; }
.panel-section h2 { margin: 0 0 13px; font-size: 16px; letter-spacing: -0.015em; }
.section-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.section-heading.compact h2 { margin-bottom: 10px; }
.eyebrow {
  margin: 0 0 2px;
  color: #54706a;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.badge {
  min-width: 25px;
  height: 25px;
  display: inline-grid;
  place-items: center;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 12px;
  font-weight: 800;
}
.status-dot { width: 11px; height: 11px; border-radius: 50%; background: #35a45b; box-shadow: 0 0 0 4px rgba(53, 164, 91, 0.12); margin-top: 7px; }
.status-dot.warning { background: #e59b19; box-shadow: 0 0 0 4px rgba(229, 155, 25, 0.14); }

.field-label { display: block; margin: 10px 0 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
.field-control, .form-grid input, .form-grid select, .compare-selectors select {
  width: 100%;
  min-height: 39px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  padding: 8px 10px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
textarea.field-control { resize: vertical; min-height: 72px; }
.field-control:hover, .form-grid input:hover, .form-grid select:hover { border-color: #8fa49d; }
.field-control:focus, .form-grid input:focus, .form-grid select:focus, .compare-selectors select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(15, 61, 62, 0.1);
  outline: 0;
}
.help-text { margin: 8px 0 0; color: var(--ink-soft); font-size: 11px; }
.warning-text { color: #73510c; }
.inline-status { margin-top: 9px; padding: 8px 9px; border-radius: 8px; background: var(--surface-soft); color: var(--ink-soft); font-size: 11px; }
.inline-status.error { background: var(--danger-soft); color: var(--danger); }
.inline-status.success { background: #eaf7ed; color: #1b6e32; }

.button {
  min-height: 36px;
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 7px 11px;
  font-weight: 750;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
}
.button:hover { transform: translateY(-1px); }
.button:active { transform: translateY(0); }
.button:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
.button-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.button-primary:hover { background: var(--brand-hover); }
.button-secondary { background: var(--surface); border-color: var(--line-strong); }
.button-secondary:hover { background: var(--surface-soft); border-color: #8fa49d; }
.button-secondary.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.button-danger-subtle { background: var(--danger-soft); color: var(--danger); border-color: #f4c7c1; }
.button-quiet { background: transparent; color: var(--ink-soft); border-color: transparent; }
.button-quiet:hover { background: var(--surface-muted); }
.full-width { width: 100%; }
.button-grid { display: grid; gap: 7px; margin-top: 10px; }
.button-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.button-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.icon-button {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-weight: 800;
}
.icon-button:hover { background: var(--surface-soft); }

.search-box { position: relative; }
.search-box .field-control { padding-right: 35px; }
.search-clear { position: absolute; right: 7px; top: 6px; width: 27px; height: 27px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; color: var(--ink-soft); }
.search-clear:hover { background: var(--surface-muted); }
.search-results {
  position: absolute;
  z-index: 1600;
  left: 0;
  right: 0;
  top: calc(100% + 5px);
  max-height: 300px;
  overflow-y: auto;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.search-result {
  width: 100%;
  display: block;
  padding: 10px 11px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.search-result:last-child { border-bottom: 0; }
.search-result:hover, .search-result:focus { background: var(--surface-soft); outline: 0; }
.search-result strong { display: block; font-size: 12px; }
.search-result span { display: block; color: var(--ink-soft); font-size: 10px; margin-top: 2px; text-transform: capitalize; }
.search-message { padding: 11px; color: var(--ink-soft); font-size: 12px; }

.draw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.draw-button {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface);
  cursor: pointer;
  font-size: 11px;
  font-weight: 750;
  text-align: left;
}
.draw-button:hover { background: var(--surface-soft); }
.draw-button.active { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.swatch, .legend-box { width: 14px; height: 14px; flex: 0 0 auto; border-radius: 4px; display: inline-block; }
.swatch-building { background: var(--building); }
.swatch-green { background: var(--green); }
.swatch-parking { background: var(--parking); }
.swatch-public { background: var(--public); }
.tool-row { margin-top: 8px; }
.check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
.check-row input { accent-color: var(--brand); }

.map-column { position: relative; min-width: 0; min-height: 0; background: #dce6df; }
#map { width: 100%; height: 100%; min-height: 400px; background: #dce6df; }
.leaflet-container { font-family: inherit; }
.leaflet-control-layers, .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow-small) !important; }
.leaflet-control-layers { border-radius: 10px !important; }
.leaflet-control-zoom a { color: var(--brand) !important; }
.map-progress {
  position: absolute;
  z-index: 1000;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: var(--shadow-small);
  color: var(--ink-soft);
  font-size: 12px;
}
.spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.map-tip {
  position: absolute;
  z-index: 700;
  left: 14px;
  top: 14px;
  max-width: 360px;
  padding: 8px 11px;
  border-radius: 8px;
  background: rgba(15, 61, 62, 0.92);
  color: #fff;
  box-shadow: var(--shadow-small);
  font-size: 11px;
  pointer-events: none;
}
.map-legend {
  position: absolute;
  z-index: 700;
  left: 14px;
  bottom: 24px;
  min-width: 165px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: var(--shadow-small);
  overflow: hidden;
}
.legend-title { width: 100%; padding: 8px 10px; border: 0; background: transparent; text-align: left; font-weight: 800; cursor: pointer; }
.legend-title:hover { background: var(--surface-soft); }
.legend-content { display: grid; gap: 6px; padding: 0 10px 10px; color: var(--ink-soft); font-size: 10px; }
.legend-content span { display: flex; align-items: center; gap: 7px; }
.legend-line { width: 16px; height: 0; border-top: 2px solid #5c6c68; display: inline-block; }
.legend-selected { background: rgba(246, 183, 60, 0.6); border: 2px solid #9d6a00; }

.kpi-section { background: linear-gradient(180deg, #f7faf7 0%, #fff 100%); }
.kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi-card {
  min-height: 72px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
}
.kpi-card-wide { grid-column: 1 / -1; min-height: 68px; }
.kpi-card span { color: var(--ink-soft); font-size: 10px; font-weight: 700; }
.kpi-card strong { font-size: 17px; letter-spacing: -0.025em; }
.kpi-card strong.negative { color: var(--danger); }
.kpi-card strong.positive { color: #18713a; }
.form-grid { display: grid; gap: 10px; }
.form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid label > span { display: block; margin-bottom: 5px; color: var(--ink-soft); font-size: 10px; font-weight: 700; }
.input-suffix { display: flex; align-items: stretch; }
.input-suffix input { border-radius: 9px 0 0 9px; min-width: 0; }
.input-suffix em { display: grid; place-items: center; min-width: 41px; padding: 0 7px; border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 9px 9px 0; background: var(--surface-soft); color: var(--ink-soft); font-size: 10px; font-style: normal; }
.range-row { display: grid; grid-template-columns: 1fr 48px; align-items: center; gap: 10px; }
.range-row input { accent-color: var(--brand); }
.range-row output { text-align: right; font-weight: 800; }
.object-summary { margin: 13px 0; border-top: 1px solid var(--line); }
.object-summary div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.object-summary dt { color: var(--ink-soft); }
.object-summary dd { margin: 0; font-weight: 800; }
.empty-state { text-align: center; padding-top: 24px; padding-bottom: 24px; }
.empty-state strong { font-size: 13px; }
.empty-state p { margin: 5px auto 0; max-width: 250px; color: var(--ink-soft); font-size: 11px; }
.source-note strong { font-size: 11px; }
.source-note p { margin: 5px 0 0; color: var(--ink-soft); font-size: 10px; }

.modal {
  width: min(92vw, 620px);
  max-height: 90vh;
  padding: 0;
  border: 0;
  border-radius: 16px;
  background: transparent;
  box-shadow: var(--shadow);
}
.modal::backdrop { background: rgba(11, 27, 27, 0.52); backdrop-filter: blur(2px); }
.modal-card { margin: 0; padding: 22px; background: var(--surface); overflow-y: auto; max-height: 90vh; }
.modal-card-wide { width: min(92vw, 760px); }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-header h2 { margin: 0; font-size: 22px; }
.modal-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
.steps-list { list-style: none; padding: 0; margin: 20px 0; counter-reset: steps; display: grid; gap: 12px; }
.steps-list li { position: relative; padding-left: 42px; min-height: 32px; counter-increment: steps; }
.steps-list li::before { content: counter(steps); position: absolute; left: 0; top: -2px; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 900; }
.steps-list strong, .steps-list span { display: block; }
.steps-list span { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
.callout { padding: 13px; border-left: 4px solid var(--accent); border-radius: 8px; background: #fff8e8; }
.callout p { margin: 4px 0 0; color: #665024; font-size: 12px; }
.compare-selectors { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin: 20px 0; }
.compare-selectors label { color: var(--ink-soft); font-size: 11px; font-weight: 700; }
.compare-selectors select { display: block; margin-top: 5px; }
.compare-selectors > span { padding-bottom: 10px; color: var(--ink-soft); font-size: 11px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.compare-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.compare-table th, .compare-table td { padding: 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.compare-table th:first-child, .compare-table td:first-child { text-align: left; }
.compare-table thead th { background: var(--surface-soft); color: var(--ink-soft); font-size: 10px; }
.compare-table tbody tr:last-child td { border-bottom: 0; }
.compare-table .positive { color: #18713a; font-weight: 800; }
.compare-table .negative { color: var(--danger); font-weight: 800; }

.toast-container { position: fixed; z-index: 3000; right: 18px; bottom: 18px; display: grid; gap: 9px; pointer-events: none; }
.toast { max-width: 360px; padding: 11px 13px; border-radius: 10px; background: #173333; color: #fff; box-shadow: var(--shadow); font-size: 12px; animation: toast-in 0.18s ease-out; }
.toast.error { background: #8d1b13; }
.toast.success { background: #176b34; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.fatal-message { margin: 0; padding: 14px; background: #8d1b13; color: #fff; text-align: center; font-weight: 700; }

@media (max-width: 1180px) {
  .workspace { grid-template-columns: 280px minmax(380px, 1fr) 292px; }
  .panel-section { padding-left: 14px; padding-right: 14px; }
  .save-status { display: none; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .app-shell { height: auto; min-height: 100vh; }
  .topbar { position: sticky; top: 0; align-items: flex-start; }
  .topbar-actions { max-width: 58%; }
  .workspace { display: grid; grid-template-columns: 1fr; }
  .map-column { order: 1; height: 68vh; min-height: 520px; }
  .panel-left { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .panel-right { order: 3; border-left: 0; border-top: 1px solid var(--line); }
  .panel { overflow: visible; }
  .panel-left, .panel-right { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .panel-section { border-right: 1px solid var(--line); }
}

@media (max-width: 620px) {
  .topbar { display: block; }
  .brand { margin-bottom: 10px; }
  .topbar-actions { max-width: none; justify-content: flex-start; }
  .topbar-actions .button { flex: 1 1 auto; }
  .map-column { height: 62vh; min-height: 430px; }
  .panel-left, .panel-right { display: block; }
  .panel-section { border-right: 0; }
  .map-tip { right: 14px; max-width: none; }
  .compare-selectors { grid-template-columns: 1fr; }
  .compare-selectors > span { padding: 0; text-align: center; }
}
